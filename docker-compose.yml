# Local Postgres for the API (`bun run db:up`), same major version as Supabase.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pulso
      POSTGRES_PASSWORD: pulso
      POSTGRES_DB: pulso_concept
    ports:
      - "5438:5432"
    volumes:
      - pulso-concept-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulso -d pulso_concept"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pulso-concept-pg:
